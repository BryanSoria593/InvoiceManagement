<mat-sidenav-container class="sidenav-container">
  <mat-sidenav mode="side" opened class="sidenav">
    <mat-toolbar color="primary">Invoices</mat-toolbar>
    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active"><mat-icon>home</mat-icon>Inicio</a>
      <a mat-list-item routerLink="/products" routerLinkActive="active"><mat-icon>inventory_2</mat-icon>Productos</a>
      <a mat-list-item routerLink="/customers" routerLinkActive="active"><mat-icon>groups</mat-icon>Clientes</a>
      <a mat-list-item routerLink="/users" routerLinkActive="active"><mat-icon>person</mat-icon>Usuarios</a>
      <a mat-list-item routerLink="/invoices" routerLinkActive="active"><mat-icon>receipt_long</mat-icon>Facturas</a>
      <a mat-list-item routerLink="/configuration" routerLinkActive="active"><mat-icon>settings</mat-icon>Configuración</a>
    </mat-nav-list>
    <a mat-list-item (click)="logout()" style="margin-top: 24px; color: #e53935; font-weight: 500;">
      <mat-icon style="margin-right: 12px;">logout</mat-icon>
      <span>Cerrar sesión</span>
    </a>
  </mat-sidenav>
  <mat-sidenav-content>
    <ng-content></ng-content>
  </mat-sidenav-content>
</mat-sidenav-container>
