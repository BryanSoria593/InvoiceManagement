<app-menu-layout>
  <div class="invoices-container">
    <div class="header">
      <h2>Facturas</h2>
      <button mat-raised-button color="primary" (click)="onCreateInvoice()">
        Nueva Factura
      </button>
    </div>

    <div style="margin-bottom: 16px;">
      <app-search-filter (filterChange)="applyFilter($event)"></app-search-filter>
    </div>

    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
      
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>#</th>
        <td mat-cell *matCellDef="let invoice">{{ invoice.id }}</td>
      </ng-container>

      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef>Fecha</th>
        <td mat-cell *matCellDef="let invoice">
          {{ invoice.date | date:'dd/MM/yyyy' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="customerName">
        <th mat-header-cell *matHeaderCellDef>Cliente</th>
        <td mat-cell *matCellDef="let invoice">
          {{ invoice.customerName }}
        </td>
      </ng-container>

      <ng-container matColumnDef="userName">
        <th mat-header-cell *matHeaderCellDef>Vendedor</th>
        <td mat-cell *matCellDef="let invoice">
          {{ invoice.userName }}
        </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let invoice">
          {{ invoice.status }}
        </td>
      </ng-container>

      <ng-container matColumnDef="total">
        <th mat-header-cell *matHeaderCellDef>Total</th>
        <td mat-cell *matCellDef="let invoice">
          {{ invoice.total | currency }}
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let invoice">
          <button mat-icon-button color="primary" (click)="editInvoice(invoice)">
            <mat-icon>edit</mat-icon>
          </button>

          <button mat-icon-button color="warn" (click)="deleteInvoice(invoice)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>
    <mat-paginator [length]="total()" [pageSize]="pageSize()" [pageSizeOptions]="pageSizeOptions()" (page)="onPage($event)"></mat-paginator>

  </div>
</app-menu-layout>
