<h2 mat-dialog-title>Buscar productos</h2>
<div mat-dialog-content>
    <div>
      <app-search-filter (filterChange)="applyFilter($event)"></app-search-filter>
    </div>
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
    <ng-container matColumnDef="code">
      <th mat-header-cell *matHeaderCellDef>Código</th>
      <td mat-cell *matCellDef="let row; let i = index">{{ row.code }}</td>
    </ng-container>
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Producto</th>
      <td mat-cell *matCellDef="let row; let i = index">{{ row.name }}</td>
    </ng-container>
    <ng-container matColumnDef="quantity">
      <th mat-header-cell *matHeaderCellDef>Cant.</th>
      <td mat-cell *matCellDef="let row; let i = index">
        <input matInput type="number" min="1" [formControl]="getQuantityControl(i)" (input)="onQuantityOrPriceChange(i)" style="width: 60px;">
      </td>
    </ng-container>
    <ng-container matColumnDef="unitPrice">
      <th mat-header-cell *matHeaderCellDef>Precio</th>
      <td mat-cell *matCellDef="let row; let i = index">
        <input matInput type="number" min="0" [formControl]="getUnitPriceControl(i)" (input)="onQuantityOrPriceChange(i)" style="width: 80px;">
      </td>
    </ng-container>
    <ng-container matColumnDef="add">
      <th mat-header-cell *matHeaderCellDef>Agregar</th>
      <td mat-cell *matCellDef="let row; let i = index">
        <button mat-icon-button color="primary" (click)="addProduct(i)">
          <mat-icon>add_shopping_cart</mat-icon>
        </button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
  <mat-paginator [length]="total" [pageSize]="pageSize" [pageIndex]="pageIndex" [pageSizeOptions]="pageSizeOptions" (page)="onPage($event)"></mat-paginator>
</div>
<div mat-dialog-actions align="end">
  <button mat-button (click)="close()">Cerrar</button>
</div>
