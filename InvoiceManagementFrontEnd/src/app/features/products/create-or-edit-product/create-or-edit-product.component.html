<h2 mat-dialog-title>{{ title }}</h2>
<form [formGroup]="form" (ngSubmit)="onSave()" mat-dialog-content>
  <mat-form-field appearance="fill" class="w-100">
    <mat-label>Código</mat-label>
    <input matInput formControlName="code" [readonly]="readOnly">
  </mat-form-field>
  <mat-form-field appearance="fill" class="w-100">
    <mat-label>Nombre</mat-label>
    <input matInput formControlName="name" [readonly]="readOnly">
  </mat-form-field>
  <mat-form-field appearance="fill" class="w-100">
    <mat-label>Descripción</mat-label>
    <textarea matInput formControlName="description" [readonly]="readOnly"></textarea>
  </mat-form-field>
  <mat-form-field appearance="fill" class="w-100">
    <mat-label>Precio</mat-label>
    <input matInput type="number" formControlName="salePrice" [readonly]="readOnly">
  </mat-form-field>
  <mat-form-field appearance="fill" class="w-100">
    <mat-label>Estado</mat-label>
    <mat-select formControlName="status" [disabled]="readOnly">
      @for (key of (ProductStatus | keyvalue); track key.value) {
        @if (typeof key.value === 'number') {
          <mat-option [value]="key.value">
            {{ key.value === ProductStatus.Active ? 'Activo' : 'Inactivo' }}
          </mat-option>
        }
      }
    </mat-select>
  </mat-form-field>
  <div mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Cancelar</button>
    <button mat-raised-button color="primary" type="submit" *ngIf="!readOnly">Guardar</button>
  </div>
</form>
