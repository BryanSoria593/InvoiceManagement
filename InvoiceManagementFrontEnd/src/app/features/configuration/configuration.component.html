<app-menu-layout>
    <div class="config-container">
        @if(form){
            <form [formGroup]="form" (ngSubmit)="onSubmit()">
                <h2>Configuración</h2>
                <div class="config-grid">
                <div class="logo-section">
                    @if(logoPreview) {
                        <img  [src]="logoPreview" alt="Logo" class="logo-img" />
                    }
                    <label>Seleccionar logo</label>
                    <input type="file" (change)="onLogoChange($event)" accept="image/*" />
                </div>
                <div class="fields-section">
                    <mat-form-field class="w-100"><mat-label>Nombre de la empresa</mat-label><input matInput formControlName="companyName"></mat-form-field>
                    <mat-form-field class="w-100"><mat-label>Teléfono</mat-label><input matInput formControlName="phone"></mat-form-field>
                    <mat-form-field class="w-100"><mat-label>Correo electrónico</mat-label><input matInput formControlName="email"></mat-form-field>
                    <mat-form-field class="w-100"><mat-label>IVA (%)</mat-label><input matInput formControlName="vatPercentage" type="number"></mat-form-field>
                    <mat-form-field class="w-100"><mat-label>Símbolo de moneda</mat-label><input matInput formControlName="currencySymbol"></mat-form-field>
                    <mat-form-field class="w-100"><mat-label>Dirección</mat-label><input matInput formControlName="address"></mat-form-field>
                    <mat-form-field class="w-100"><mat-label>Ciudad</mat-label><input matInput formControlName="city"></mat-form-field>
                    <mat-form-field class="w-100"><mat-label>Región/Provincia</mat-label><input matInput formControlName="region"></mat-form-field>
                    <mat-form-field class="w-100"><mat-label>Código postal</mat-label><input matInput formControlName="postalCode"></mat-form-field>
                </div>
                </div>
                <div class="actions">
                <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || loading()">Actualizar datos</button>
                </div>
            </form>
        }
    </div>
</app-menu-layout>
